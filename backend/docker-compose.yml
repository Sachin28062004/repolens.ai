services:
  db:
    image: postgres:13
    container_name: repolens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repolens}
      POSTGRES_USER: ${POSTGRES_USER:-repolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repolens}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repolens} -d ${POSTGRES_DB:-repolens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-repolens}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-repolens}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-repolens}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-very-long-random-secret-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
